<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skills.exe — Noah Zhou</title>
<meta name="description" content="Noah Zhou's skills & projects — in a Windows XP desktop. Double-click an icon to explore.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🛠️</text></svg>">
<style>
:root{
  --cap1:#0058e6; --cap2:#3a9bff; --capIn1:#8aa8dc; --capIn2:#d0ddf0;
  --luna-face:#ece9d8; --border:#0831d9; --btnface:#f0eee2;
  --tahoma:"Tahoma","Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{height:100%; margin:0; overflow:hidden;}
body{font-family:var(--tahoma); font-size:11px; color:#000;}
body[data-wall="bliss"]{background:#000 url(assets/bliss.svg) center/cover no-repeat;}
body[data-wall="teal"]{background:#008080;}
body[data-wall="sky"]{background:linear-gradient(180deg,#4a7fd4 0%,#7fb0e8 55%,#cfe4f4 100%);}

/* ─────────── boot ─────────── */
#boot{position:fixed; inset:0; z-index:9999; background:#000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:34px; transition:opacity .5s;}
#boot.off{opacity:0; pointer-events:none;}
.boot-logo{font-size:64px; font-weight:bold; font-style:italic; letter-spacing:-1px;
  background:linear-gradient(180deg,#fff 20%,#9fd0ff 60%,#3d8fe0 85%); -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(90,160,255,.25);}
.boot-sub{color:#8aa7d8; font-size:13px; margin-top:-24px; letter-spacing:3px;}
.boot-bar{width:220px; height:16px; border:2px solid #666; background:#000; padding:2px;}
.boot-bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#2f6fcf,#66a7ff);
  animation:bootfill 2.1s cubic-bezier(.3,.7,.4,1) forwards;}
@keyframes bootfill{0%{width:2%} 55%{width:58%} 82%{width:84%} 100%{width:100%}}
.boot-hint{color:#3d3d3d; font-size:11px; margin-top:-18px;}

/* ─────────── desktop icons ─────────── */
#icons{position:absolute; top:4px; left:2px; display:flex; flex-direction:column; flex-wrap:wrap;
  align-content:flex-start; height:calc(100% - 40px); gap:2px; z-index:5;}
.dicon{width:78px; padding:6px 2px 4px; display:flex; flex-direction:column; align-items:center; gap:3px;
  border:1px solid transparent; border-radius:2px; cursor:default; position:relative;}
.dicon .ico{width:36px; height:36px; font-size:30px; line-height:36px; text-align:center;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
.dicon .lab{color:#fff; text-align:center; line-height:1.2; max-width:76px;
  text-shadow:1px 1px 0 rgba(0,0,0,.75), -1px -1px 0 rgba(0,0,0,.45), 1px -1px 0 rgba(0,0,0,.45), -1px 1px 0 rgba(0,0,0,.45);
  font-size:11px;}
.dicon:hover{border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08);}
.dicon.sel{border:1px solid rgba(0,80,220,.55); background:rgba(60,120,255,.28);}
.dicon.sel .lab{background:#0a4fd6; text-shadow:none; border-radius:2px; padding:0 2px;}
.dicon .arrow{position:absolute; left:2px; bottom:10px; font-size:9px; color:#fff; opacity:.85;
  text-shadow:0 1px 1px #000;}
body[data-wall="teal"] .dicon:hover{background:rgba(255,255,255,.14);}

/* ─────────── windows ─────────── */
#winlayer{position:absolute; inset:0 0 30px 0; z-index:10; pointer-events:none;}
.win{position:absolute; min-width:240px; min-height:120px; pointer-events:auto;
  border:1px solid var(--border); border-radius:8px 8px 0 0; box-shadow:2px 2px 8px rgba(0,0,0,.45);
  display:flex; flex-direction:column; background:var(--luna-face);}
.win.maximized{border-radius:0;}
.win .wtitle{height:26px; display:flex; align-items:center; gap:5px; padding:0 3px 0 7px; cursor:default;
  background:linear-gradient(180deg,var(--cap1) 0%,var(--cap1) 45%,var(--cap2) 100%);
  border-radius:7px 7px 0 0; flex:0 0 auto;}
.win.maximized .wtitle{border-radius:0;}
.win.inactive .wtitle{background:linear-gradient(180deg,#6f85b0 0%,#6f85b0 45%,#9db2d8 100%);}
.win .wtitle .ticon{font-size:14px;}
.win .wtitle .tt{flex:1; min-width:0; color:#fff; font-weight:bold; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:1px 1px 1px rgba(0,0,0,.5);}
.win.inactive .wtitle .tt{text-shadow:none;}
.xbtns{display:flex; gap:2px;}
.xbtn{width:21px; height:21px; border:1px solid #fff; border-radius:3px; font-size:10px; line-height:1;
  display:flex; align-items:center; justify-content:center; color:#fff; background:transparent; cursor:pointer; padding:0;}
.xbtn:hover{background:rgba(255,255,255,.25);}
.xbtn.mn{font-size:10px; padding-bottom:8px;}
.xbtn.cl{background:linear-gradient(180deg,#f2a7a0,#e05a4d 45%,#c93a2c); border-color:#fff;}
.xbtn.cl:hover{background:linear-gradient(180deg,#ffb9b2,#f07062 45%,#e04a3a);}
.xbtn:active{filter:brightness(.85);}
.win.inactive .xbtn{background:rgba(255,255,255,.12);}
.win .wbody{flex:1; min-height:0; background:var(--luna-face); overflow:hidden; display:flex; flex-direction:column;}
.win .wcontent{flex:1; min-height:0; overflow:auto; background:#fff;}
.win .wstatus{flex:0 0 auto; display:flex; gap:8px; padding:2px 6px; background:var(--luna-face);
  border-top:1px solid #d4d0c8; font-size:11px; color:#000;}
.status-sunken{background:#fff; border:1px solid #aca899; border-top-color:#6e6a5e; border-left-color:#6e6a5e;
  padding:1px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.win .tbar{flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:3px 5px;
  background:linear-gradient(180deg,#f6f4ec,#e3dfd2); border-bottom:1px solid #c6c2b4;}
.win .tbar .addr{flex:1; display:flex; align-items:center; gap:3px; background:#fff;
  border:1px solid #aca899; border-top-color:#6e6a5e; border-left-color:#6e6a5e; padding:2px 6px; font-size:11px;}
.tbtn{min-width:24px; height:22px; padding:0 6px; border:1px solid #c6c2b4; border-radius:3px; cursor:pointer;
  background:linear-gradient(180deg,#fff,#e7e2d4); font-size:12px; line-height:1;}
.tbtn:active{background:#d9d4c6;}

/* explorer panes */
.xp-split{display:flex; flex:1; min-height:0;}
.xp-tree{width:212px; min-width:150px; background:#fff; overflow:auto; padding:4px 2px;
  border-right:1px solid #c6c2b4;}
.xp-detail{flex:1; min-width:0; background:#fff; overflow:auto; padding:10px 12px;}
.tree-node .trow{display:flex; align-items:center; gap:3px; padding:2px 4px; cursor:default; border-radius:2px; white-space:nowrap;}
.tree-node .trow:hover{background:#e8f0fe;}
.tree-node .trow b{font-weight:normal; font-size:11px;}
.tree-node ul{list-style:none; margin:0; padding:0 0 0 18px;}
.tree-node.collapsed ul{display:none;}
.trow .tw{width:16px; text-align:center; color:#555; font-size:9px;}
.skill-row{display:flex; align-items:center; gap:4px; padding:2px 4px; border-radius:2px; cursor:default; white-space:nowrap;}
.skill-row:hover{background:#e8f0fe;}
.skill-row.sel{background:#0a4fd6; color:#fff;}
.skill-row .sico{width:16px; height:16px; position:relative; display:inline-grid; place-items:center; font-size:7px; color:#fff;}
.skill-row .sico::after{content:attr(data-i); font-weight:bold; font-size:9px; color:#666; font-style:normal;}
.skill-row.sel .sico::after{color:#cfe0ff;}
.skill-row .sico img{position:absolute; inset:0; width:16px; height:16px; z-index:1;}
.skill-row .snm{overflow:hidden; text-overflow:ellipsis;}
.detail-title{display:flex; align-items:center; gap:8px; margin:0 0 2px; font-size:15px;}
.detail-title .dico{width:28px; height:28px; position:relative; display:inline-grid; place-items:center;}
.detail-title .dico::after{content:attr(data-i); font-size:12px; color:#999; font-weight:bold;}
.detail-title .dico img{position:absolute; inset:0; width:28px; height:28px; z-index:1;}
.detail-sub{color:#666; margin:0 0 10px; font-size:11px;}
.proj{display:flex; gap:8px; align-items:baseline; padding:5px 6px; border:1px solid #e4e0d4; border-radius:4px; margin-bottom:5px; background:#fcfbf7;}
.proj:hover{border-color:#99c1f0; background:#eef4fd;}
.proj .pi{font-size:13px;}
.proj a{color:#0046c8; text-decoration:none; font-weight:bold;}
.proj a:hover{text-decoration:underline;}
.proj .pd{color:#444; font-size:11px;}
.empty-state{color:#777; text-align:center; padding:44px 10px; font-size:13px;}
.empty-state .big{font-size:44px; display:block; margin-bottom:10px;}

/* app window list (projects / recycle) */
.app-list{list-style:none; margin:0; padding:4px;}
.app-list li{display:flex; gap:9px; padding:6px 8px; border-bottom:1px solid #eee; cursor:default;}
.app-list li:hover{background:#eef4fd;}
.app-list .pi{font-size:15px; line-height:1.2;}
.app-list a{color:#0046c8; text-decoration:none; font-weight:bold; font-size:12px;}
.app-list a:hover{text-decoration:underline;}
.app-list .pd{color:#555; font-size:11px; margin-top:1px;}
.app-list .tags{font-size:10px; color:#888;}

/* about page */
.about{padding:16px 18px; max-width:640px;}
.about h2{margin:0 0 2px; font-size:17px;}
.about .sub{color:#666; margin-bottom:10px;}
.about p{line-height:1.55; margin:0 0 10px;}
.about .row{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px;}
.chip{border:1px solid #9cc0ea; background:#e8f1fc; color:#1a4b8f; border-radius:10px; padding:2px 9px; font-size:11px;}
.about .links a{color:#0046c8; text-decoration:none;}
.about .links a:hover{text-decoration:underline;}
.about .credit{margin-top:16px; color:#999; font-size:10px; border-top:1px dotted #ccc; padding-top:8px;}
.about h4{margin:12px 0 4px; font-size:12px; color:#333;}

/* dialogs (generic XP) */
.dlg{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:4000;
  background:var(--luna-face); border:1px solid var(--border); border-radius:8px 8px 0 0;
  box-shadow:3px 3px 10px rgba(0,0,0,.5); min-width:300px;}
.dlg .wtitle{height:24px; border-radius:7px 7px 0 0;}
.dlg .db{display:flex; gap:12px; padding:16px 16px 6px; align-items:flex-start;}
.dlg .db .di{font-size:30px;}
.dlg .db .dt{font-size:11px; line-height:1.5;}
.dlg .dbtns{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px 14px;}
.xpbtn{min-width:70px; height:23px; padding:0 12px; font-family:var(--tahoma); font-size:11px; cursor:pointer;
  border:1px solid #8a8a8a; border-radius:3px; background:linear-gradient(180deg,#fff,#ece9d8 40%,#ded9c5);}
.xpbtn:active{background:linear-gradient(180deg,#d9d4c0,#c9c4b0);}
.xpbtn:disabled{color:#999; cursor:default;}

/* start menu */
#startmenu{position:fixed; left:2px; bottom:32px; z-index:5000; width:252px; background:#fff;
  border:1px solid #0831d9; border-radius:8px 8px 8px 8px; box-shadow:3px 3px 10px rgba(0,0,0,.4); overflow:hidden;}
#startmenu .sm-head{height:6px; background:linear-gradient(180deg,#3a9bff,#0058e6);}
#startmenu .sm-userrow{display:flex; align-items:center; gap:8px; padding:5px 8px;
  background:linear-gradient(180deg,#8fc1ff,#3a8bef 60%,#2a7ae0); color:#fff; font-weight:bold; font-size:12px;}
.sm-userrow .avatar{width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe9c9,#d9a05b 60%,#a06a2a);
  display:grid; place-items:center; font-size:16px;}
#startmenu .sm-in{display:flex;}
.sm-left{flex:1; padding:2px 4px 6px; overflow:hidden;}
.sm-right{width:84px; background:linear-gradient(180deg,#3a9bff,#0058e6); margin:2px 0 0 0;}
.sm-item{display:flex; align-items:center; gap:8px; padding:4px 8px; cursor:default; border-radius:3px; font-size:11px;}
.sm-item:hover{background:#0a4fd6; color:#fff;}
.sm-item .si{font-size:16px;}
.sm-sep{border-top:1px solid #d6d2c4; margin:3px 6px;}
.sm-cap{font-size:10px; color:#666; padding:4px 10px 0;}
.sm-right .sm-item{color:#fff; font-size:10px; padding:6px 2px; justify-content:center; text-align:center; flex-direction:column; gap:2px; border-radius:0;}
.sm-right .sm-item:hover{background:rgba(255,255,255,.25); color:#fff;}
.sm-right .sm-item .si{font-size:22px;}
.sm-allprog{display:flex; align-items:center; justify-content:space-between; margin:2px 6px 5px; padding:4px 8px; cursor:pointer;
  font-size:11px; border:1px solid #c6c2b4; border-radius:3px; background:linear-gradient(180deg,#fff,#f0ede0);}
.sm-allprog:hover{background:linear-gradient(180deg,#eef4fd,#dbe9fb); border-color:#7ba6d9;}
.sm-foot{display:flex; justify-content:flex-end; align-items:center; background:linear-gradient(180deg,#3a9bff,#0058e6);
  padding:3px 4px;}
.sm-foot .sm-off{display:flex; gap:3px;}
.sm-foot .sm-off button{width:auto; min-width:54px; height:24px; font-size:11px; cursor:pointer;
  border:1px solid #fff; border-radius:3px; color:#fff; background:linear-gradient(180deg,#f59b8d,#d9442f); font-family:var(--tahoma);}
.sm-foot .sm-off button:active{filter:brightness(.85);}

/* taskbar */
#taskbar{position:fixed; left:0; right:0; bottom:0; height:30px; z-index:6000;
  background:linear-gradient(180deg,#245edb 0%,#3f8cf3 8%,#245edb 45%,#123a8a 100%); display:flex; align-items:center; padding:0 2px; gap:3px;}
#startbtn{display:flex; align-items:center; gap:3px; height:24px; padding:0 9px 0 4px; border:none; cursor:pointer;
  color:#fff; font-weight:bold; font-family:var(--tahoma); font-size:15px; font-style:italic; letter-spacing:.5px;
  background:linear-gradient(180deg,#3c9b36,#2f7a2b 45%,#1f571e); border-radius:0 8px 8px 0; border:1px solid #0f3f0e; border-left:none;}
#startbtn:hover{filter:brightness(1.12);}
#startbtn.on{filter:brightness(.8);}
#tasks{flex:1; display:flex; gap:2px; align-items:center; overflow:hidden;}
.task{height:24px; max-width:160px; min-width:0; display:flex; align-items:center; gap:5px; padding:0 8px; cursor:pointer;
  color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:3px; font-size:11px;
  background:linear-gradient(180deg,#3f8cf3,#245edb 60%,#1a4bb0); font-family:var(--tahoma);}
.task .ti{font-size:13px;}
.task .tl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.task.act{background:linear-gradient(180deg,#7fb4f8,#4f8ff0 55%,#3a79dd); border-color:#fff;}
.task:hover{filter:brightness(1.1);}
#tray{display:flex; align-items:center; gap:6px; padding:0 8px; height:24px; color:#fff;
  border-left:1px solid rgba(0,0,0,.35); background:linear-gradient(180deg,#0d8fe8,#0d8fe8 30%,#0a7fd4 90%);}
#tray .tic{font-size:13px;}
#clock{font-size:11px; text-align:center; line-height:1.15;}

/* balloon */
#balloon{position:fixed; right:10px; bottom:34px; z-index:5500; width:248px;
  background:#ffffe1; border:1px solid #8a97a8; box-shadow:2px 2px 6px rgba(0,0,0,.4); display:none;}
#balloon .bh{background:#3a9bff; color:#fff; font-weight:bold; padding:2px 6px; display:flex; justify-content:space-between; font-size:11px;}
#balloon .bh .bx{cursor:pointer;}
#balloon .bt{padding:8px 10px; font-size:11px; line-height:1.5; position:relative;}
#balloon .bt .bico{font-size:20px; float:left; margin:0 8px 4px 0;}
#balloon::after{content:""; position:absolute; right:26px; bottom:-7px; border-left:8px solid transparent; border-right:8px solid transparent; border-top:8px solid #ffffe1;}

/* context menu */
#ctxmenu{position:fixed; z-index:7000; background:var(--luna-face); border:1px solid #aca899; box-shadow:2px 2px 6px rgba(0,0,0,.35); padding:2px; min-width:150px; display:none;}
#ctxmenu .ci{display:flex; align-items:center; gap:7px; padding:4px 18px 4px 7px; cursor:default;}
#ctxmenu .ci:hover{background:#0a4fd6; color:#fff;}
#ctxmenu .sep{border-top:1px solid #c6c2b4; margin:3px 2px;}

/* shutdown */
#shutdown{position:fixed; inset:0; z-index:9000; background:#000; display:none; align-items:center; justify-content:center;}
#shutdown .txt{color:#f60; font-size:30px; font-family:"Lucida Console",monospace; text-align:center;}
#shutdown.hide{display:none;}
body.no-shutdown #shutdown{display:none;}

.scroll-x{overflow-x:auto;}
a{cursor:pointer;}
</style>
</head>

/* ================= window manager ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let zTop = 100, nextCascade = 0, focusedId = null;
const winState = {};   // id -> {el, min, max, taskBtn}

function focusWin(id){
  const s = winState[id]; if(!s) return;
  focusedId = id;
  s.el.style.zIndex = ++zTop;
  s.el.classList.remove("inactive");
  $$(".win").forEach(w=>{ if(w!==s.el) w.classList.add("inactive"); });
  Object.entries(winState).forEach(([k,v])=>{
    v.taskBtn.classList.toggle("act", k===id && !v.min);
  });
}
function taskClick(id){
  const s = winState[id]; if(!s) return;
  if (s.min){ restoreWin(id); }
  else if (focusedId === id) { minimizeWin(id); }
  else focusWin(id);
}
function setActiveWinClass(){
  Object.entries(winState).forEach(([k,v])=>v.el.classList.toggle("activeWin", !v.min && v.el.style.zIndex==zTop));
}
function minimizeWin(id){
  const s = winState[id]; s.min = true; s.el.style.display="none"; s.taskBtn.classList.remove("act");
}
function restoreWin(id){
  const s = winState[id]; s.min=false; s.el.style.display="flex"; focusWin(id);
}
function closeWin(id){
  const s = winState[id]; if(!s) return;
  s.el.remove(); s.taskBtn.remove(); delete winState[id];
  const rest = Object.keys(winState);
  if(rest.length) focusWin(rest[rest.length-1]);
}
function toggleMax(id){
  const s = winState[id]; if(!s) return;
  const el = s.el;
  if (s.max){
    s.max=false; el.classList.remove("maximized");
    el.style.left=s.prev.x+"px"; el.style.top=s.prev.y+"px";
    el.style.width=s.prev.w+"px"; el.style.height=s.prev.h+"px";
    s.mxBtn.textContent="❐";
  } else {
    s.max=true;
    const r = el.getBoundingClientRect();
    s.prev = {x:r.left, y:r.top, w:r.width, h:r.height};
    el.classList.add("maximized");
    el.style.left="0"; el.style.top="0"; el.style.width="100%"; el.style.height="100%";
    s.mxBtn.textContent="❐"; /* restore glyph */
  }
  focusWin(id);
}
function createWin(id, title, icon, contentHTML, opts){
  opts = opts || {};
  closeWin(id); /* single instance per id */
  const el = document.createElement("div");
  el.className = "win";
  el.style.zIndex = ++zTop;
  const tw = document.createElement("div"); tw.className="wtitle";
  const tbody = document.createElement("div"); tbody.className="wbody";
  el.appendChild(tw); el.appendChild(tbody);

  const W = opts.w || Math.min(860, innerWidth-40);
  const H = opts.h || Math.min(560, innerHeight-80);
  const cx = 40 + (nextCascade*26) % 160, cy = 24 + (nextCascade*22) % 120;
  nextCascade++;
  const availW = Math.max(320, innerWidth-60), availH = Math.max(260, innerHeight-90);
  const ww = Math.min(W, availW), wh = Math.min(H, availH);
  el.style.width = ww+"px"; el.style.height = wh+"px";
  const maxX = Math.max(0, innerWidth - ww - 8), maxY = Math.max(0, innerHeight - 30 - wh - 6);
  el.style.left = Math.min(cx, maxX)+"px"; el.style.top = Math.min(cy, maxY)+"px";

  tw.innerHTML = '<span class="ticon">'+icon+'</span><span class="tt"></span>';
  tw.querySelector(".tt").textContent = title;
  const btns = document.createElement("div"); btns.className="xbtns";
  const bMin=document.createElement("button"), bMx=document.createElement("button"), bCl=document.createElement("button");
  bMin.className="xbtn mn"; bMin.title="Minimize"; bMin.textContent="—";
  bMx.className="xbtn"; bMx.title="Maximize"; bMx.textContent="❐";
  bCl.className="xbtn cl"; bCl.title="Close"; bCl.textContent="✕";
  btns.append(bMin,bMx,bCl); tw.appendChild(btns);
  bCl.addEventListener("click", e=>{e.stopPropagation(); closeWin(id);});
  bMin.addEventListener("click", e=>{e.stopPropagation(); minimizeWin(id);});
  bMx.addEventListener("click", e=>{e.stopPropagation(); toggleMax(id);});

  if (typeof contentHTML === "function") contentHTML = contentHTML(el);
  tbody.innerHTML = contentHTML;
  el.addEventListener("pointerdown", ()=>focusWin(id), true);

  /* drag */
  let drag=null;
  tw.addEventListener("pointerdown", e=>{
    if (e.target.closest(".xbtn")) return;
    if (winState[id] && winState[id].max) return;
    focusWin(id);
    drag = {sx:e.clientX, sy:e.clientY, ox:el.offsetLeft, oy:el.offsetTop};
    tw.setPointerCapture(e.pointerId);
  });
  tw.addEventListener("pointermove", e=>{
    if(!drag) return;
    const nx = Math.min(Math.max(0, drag.ox + e.clientX - drag.sx), Math.max(0, innerWidth - el.offsetWidth - 2));
    const ny = Math.min(Math.max(0, drag.oy + e.clientY - drag.sy), Math.max(0, innerHeight - 30 - el.offsetHeight - 2));
    el.style.left=nx+"px"; el.style.top=ny+"px";
  });
  const endDrag=e=>{ drag=null; };
  tw.addEventListener("pointerup", endDrag);
  tw.addEventListener("pointercancel", endDrag);
  tw.addEventListener("dblclick", e=>{ if(!e.target.closest(".xbtn")) toggleMax(id); });

  /* taskbar button */
  const tb = document.createElement("button");
  tb.className="task"; tb.innerHTML='<span class="ti">'+icon+'</span><span class="tl"></span>';
  tb.querySelector(".tl").textContent = title;
  tb.addEventListener("click", ()=>taskClick(id));
  $("#tasks").appendChild(tb);

  winState[id] = {el, min:false, max:false, taskBtn:tb, mxBtn:bMx};
  $("#winlayer").appendChild(el);
  focusWin(id);
  return id;
}

      const li = document.createElement("li");
      const row = document.createElement("div"); row.className="skill-row";
      row.innerHTML = skillIconHTML(name)+'<span class="snm">'+name+"</span>";
      row.addEventListener("click", ()=>{
        if(sel) sel.classList.remove("sel");
        row.classList.add("sel"); sel=row;
        showSkillDetail(group, name);
      });
      li.appendChild(row); ul.appendChild(li);
      skillRows.push({row, group, name});
    }
    node.appendChild(head); node.appendChild(ul);
    tree.appendChild(node);
  }
  $("#sk-count").textContent = totalSkills+" skills · "+totalProj+" projects";
  /* default select: first skill with projects */
  for (const r of skillRows){ if(DATA[r.group][r.name].projects.length){ r.row.click(); break; } }
  window._skillRows = skillRows;
}
function showSkillDetail(group, name){
  const e = DATA[group][name];
  const d = $("#sk-detail");
  let html = '<h2 class="detail-title">'+detailIconHTML(name)+' <span>'+name+"</span></h2>";
  html += '<div class="detail-sub">'+group+" · "+e.projects.length+" related project(s)</div>";
  if (!e.projects.length) html += '<div class="empty-state"><span class="big">📁</span>'+NOSKILL+"</div>";
  else html += e.projects.map(projHTML).join("");
  d.innerHTML = html;
  $("#sk-status").textContent = name+" — "+e.projects.length+" related project(s)";
}

function openProjects(){
  if(winState.projects && !winState.projects.min) return focusWin("projects");
  createWin("projects", WIN_TITLES.projects, "📂", ()=>{
    let rows = ALLPROJ.map(p=>'<li><span class="pi">📄</span><div><a href="'+p.u+'" target="_blank" rel="noopener">'+p.name+'</a>'+
      '<div class="pd">'+p.d+'</div><div class="tags">via '+p.skill+' · '+p.group+"</div></div></li>").join("");
    return '<div style="flex:1; min-height:0; overflow:auto; background:#fff"><ul class="app-list">'+rows+"</ul></div>";
  }, {w:720, h:520});
  const w = winState.projects.el;
  const st = document.createElement("div"); st.className="wstatus";
  st.innerHTML = '<span class="status-sunken" style="flex:1">'+ALLPROJ.length+" unique project(s) · double-click a row or click the title to visit</span>";
  w.querySelector(".wbody").appendChild(st);
}

function openAbout(){
  if(winState.about && !winState.about.min) return focusWin("about");
  const html = '<div class="about">'+
    '<h2>Noah Zhou <span style="color:#999;font-weight:normal">(周方亚诺)</span></h2>'+
    '<div class="sub">Software Engineering + Business Administration · South China University of Technology (SCUT)</div>'+
    '<p>I like building things — web apps, AI experiments, and the occasional weird idea. I read, watch and listen a lot, and I care about recommender systems, social computing and how humans and AI actually work together.</p>'+
    '<h4>🔬 Research interests</h4><div class="row">'+
    ["Artificial Intelligence","Deep Learning","Social Computing","Multi-Agent Systems","Human-AI Collaboration","AI for Business","Recommender Systems"].map(x=>'<span class="chip">'+x+"</span>").join("")+
    '</div><h4>🌐 Elsewhere on the web</h4><div class="links">'+
    '<div>💡 Personal page → <a href="https://noahisarider.github.io/" target="_blank" rel="noopener">noahisarider.github.io</a></div>'+
    '<div>🐙 GitHub → <a href="https://github.com/NoahIsARider" target="_blank" rel="noopener">NoahIsARider</a> · 54+ public repositories</div>'+
    '<div>🎓 Google Scholar → <a href="'+SCHOLAR+'" target="_blank" rel="noopener">publications incl. an accepted IEEE TCE paper</a></div>'+
    '<div>📰 Blogs → <a href="https://noahsblogs.pages.dev/" target="_blank" rel="noopener">noahsblogs.pages.dev</a></div>'+
    '<div>📚 Goodreads → <a href="https://www.goodreads.com/ratkingsyndrome" target="_blank" rel="noopener">Rat King Syndrome</a></div>'+
    "</div>"+
    '<div class="credit">This desktop was booted with love by Triton 🌊 — running on GitHub Pages, no real Microsoft products were harmed.</div>'+
    "</div>";
  createWin("about", WIN_TITLES.about, "👤", html, {w:560, h:520});
}

function openRecycle(){
  if(winState.recycle && !winState.recycle.min) return focusWin("recycle");
  createWin("recycle", WIN_TITLES.recycle, "🗑️",
    '<div style="flex:1;min-height:0;overflow:auto;background:#fff"><div class="empty-state"><span class="big">🗑️</span>Recycle Bin is empty.<br><span style="font-size:11px;color:#aaa">Nothing has been thrown away. Yet.</span></div></div>',
    {w:420, h:300});
  const w = winState.recycle.el;
  const st = document.createElement("div"); st.className="wstatus";
  st.innerHTML = '<span class="status-sunken" style="flex:1">0 objects</span>';
  w.querySelector(".wbody").appendChild(st);
}

/* ================= start menu ================= */
const START_ACTIONS = {
  skills: ()=>openSkills(), projects: ()=>openProjects(), about: ()=>openAbout(),
  recycle: ()=>openRecycle(), display: ()=>openDisplayProps(),
  github: ()=>window.open("https://github.com/NoahIsARider","_blank"),
  scholar: ()=>window.open(SCHOLAR,"_blank"),
  home: ()=>window.open("https://noahisarider.github.io/","_blank"),
  blogs: ()=>window.open("https://noahsblogs.pages.dev/","_blank")
};
function smItem(i,t,act){ return '<div class="sm-item" data-act="'+act+'"><span class="si">'+i+'</span><span>'+t+'</span></div>'; }
function buildStartMenu(){
  const m = $("#startmenu");
  const leftMain = '<div class="sm-cap">Internet</div>'+
    smItem("🐙","GitHub","github")+
    smItem("🎓","Google Scholar","scholar")+
    '<div class="sm-sep"></div>'+
    smItem("🏠","Homepage","home")+
    smItem("📰","Blogs","blogs");
  const allProg = '<div class="sm-sep"></div>'+
    smItem("🛠️","My Skills","skills")+
    smItem("📂","My Projects","projects")+
    smItem("👤","About Me","about")+
    '<div class="sm-sep"></div>'+
    smItem("🖥️","Display Properties","display");
  m.innerHTML = '<div class="sm-head"></div>'+
    '<div class="sm-userrow"><span class="avatar">👤</span><span>Noah Zhou</span></div>'+
    '<div class="sm-in"><div class="sm-left" id="sm-left">'+leftMain+
      '<div class="sm-allprog" id="sm-all"><span>All Programs</span><span>▶</span></div>'+
    '</div><div class="sm-right">'+
      smItem("🛠️","My<br>Skills","skills")+
      smItem("📂","My<br>Projects","projects")+
      smItem("👤","About<br>Me","about")+
      smItem("🗑️","Recycle<br>Bin","recycle")+
    "</div></div>"+
    '<div class="sm-foot"><span class="sm-off"><button data-off="restart">Restart</button><button data-off="turn">Turn Off</button></span></div>';
  let inAll = false;
  function renderLeft(progView){
    const left = $("#sm-left");
    left.innerHTML = progView
      ? smItem("◀","Back","__back")+allProg
      : leftMain+'<div class="sm-allprog" id="sm-all"><span>All Programs</span><span>▶</span></div>';
    inAll = progView;
  }
  m.addEventListener("click", e=>{
    const it = e.target.closest(".sm-item");
    if (it){
      const a = it.dataset.act;
      if (a === "__back"){ renderLeft(false); return; }
      if (a && START_ACTIONS[a]) START_ACTIONS[a]();
      hideStart();
      return;
    }
    if (e.target.closest("#sm-all")){ renderLeft(!inAll); return; }
  });
  m.querySelectorAll("[data-off]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const off = b.dataset.off;
    hideStart();
    if (off==="restart") location.reload();
    else if (off==="turn") doShutdown();
  }));
}
function toggleStart(){
  const m = $("#startmenu");
  const show = m.style.display==="none";
  m.style.display = show?"block":"none";
  $("#startbtn").classList.toggle("on", show);
}
function hideStart(){ $("#startmenu").style.display="none"; $("#startbtn").classList.remove("on"); }
function doShutdown(){
  $$(".win").forEach(w=>w.remove());
  Object.keys(winState).forEach(k=>delete winState[k]);
  $("#tasks").innerHTML="";
  const sd = $("#shutdown");
  sd.style.display="flex";
  document.body.classList.add("no-shutdown");
  setTimeout(()=>{ sd.style.display="none"; location.reload(); }, 4000);
}

/* ================= context menu ================= */
function showDesktopMenu(e){
  const cm = $("#ctxmenu");
  cm.innerHTML = '<div class="ci" data-act="refresh">🔄 Refresh</div>'+
                 '<div class="ci" data-act="props">🖥️ Properties</div>';
  cm.style.display="block";
  const r = cm.getBoundingClientRect();
  cm.style.left = Math.min(e.clientX, innerWidth-r.width-4)+"px";
  cm.style.top = Math.min(e.clientY, innerHeight-30-r.height-4)+"px";
  cm.dataset.mode="desktop";
}
function showIconMenu(e, el, it){
  const cm = $("#ctxmenu");
  cm.innerHTML = '<div class="ci" data-act="open">Open</div>';
  cm.style.display="block";
  const r = cm.getBoundingClientRect();
  cm.style.left = Math.min(e.clientX, innerWidth-r.width-4)+"px";
  cm.style.top = Math.min(e.clientY, innerHeight-30-r.height-4)+"px";
  cm.dataset.mode="icon";
  cm._icon = it;
}
function hideMenu(){ const cm=$("#ctxmenu"); cm.style.display="none"; }
$("#ctxmenu").addEventListener("click", e=>{
  const ci = e.target.closest(".ci"); if(!ci) return;
  const cm = $("#ctxmenu");
  if (cm.dataset.mode==="icon" && ci.dataset.act==="open"){ cm._icon.act(); }
  else if (ci.dataset.act==="refresh"){ flashIcons(); }
  else if (ci.dataset.act==="props"){ openDisplayProps(); }
  hideMenu();
});
function flashIcons(){
  $$(".dicon").forEach((d,i)=>d.animate([{opacity:.25},{opacity:1}], {duration:160, delay:i*18}));
}
function openDisplayProps(){
  if(winState.display && !winState.display.min) return focusWin("display");
  createWin("display", "Display Properties", "🖥️", ()=>{
    const opts = [
      ["bliss","Bliss (green hill)","🖼️", "assets/bliss.svg"],
      ["sky","Blue sky","🌤️", null],
      ["teal","Classic teal","🎨", null]
    ];
    const cur = document.body.dataset.wall;
    return '<div class="about" style="padding:12px 14px">'+
      '<h4 style="margin-top:0">Wallpaper</h4><div class="row">'+
      opts.map(o=>'<label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer">'+
        '<input type="radio" name="wall" value="'+o[0]+'"'+(cur===o[0]?" checked":"")+" onclick=\"applyWall('"+o[0]+"')\">"+
        o[1]+"</label>").join("")+
      "</div>"+
      '<div style="border:1px solid #999;height:120px;background:url(assets/bliss.svg) center/cover" id="wall-prev"></div>'+
      '<p style="color:#666;font-size:10px;margin-top:6px">Display: 1024×768 (virtual) · Theme: Windows XP Luna · “skills edition”</p>'+
      "</div>";
  }, {w:420, h:330});
}
function applyWall(v){
  document.body.dataset.wall = v;
  const prev = document.getElementById("wall-prev");
  if (prev) prev.style.background = v==="bliss" ? "url(assets/bliss.svg) center/cover" : (v==="sky" ? "linear-gradient(180deg,#4a7fd4,#cfe4f4)" : "#008080");
}

/* ================= clock / tray ================= */
function tick(){
  const d = new Date();
  const h = d.getHours()%12 || 12;
  const m = String(d.getMinutes()).padStart(2,"0");
  const ampm = d.getHours()>=12?"PM":"AM";
  $("#clock").textContent = h+":"+m+" "+ampm;
  $("#clock").title = d.toLocaleDateString(undefined,{weekday:"short",year:"numeric",month:"short",day:"numeric"});
}
setInterval(tick, 10000); tick();

/* ================= boot & balloon ================= */
function boot(){
  const b = $("#boot");
  const done = ()=>{ b.classList.add("off"); setTimeout(()=>b.remove(), 600); };
  const t0 = Date.now();
  b.addEventListener("click", done);
  setTimeout(done, 2600);
  /* balloon after boot */
  setTimeout(()=>{ $("#balloon").style.display="block"; }, t0>2600?300:3400);
}
$("#balloon-x").addEventListener("click", ()=>$("#balloon").style.display="none");
$("#balloon").addEventListener("click", e=>{ if(!e.target.closest(".bh")) $("#balloon").style.display="none"; });

/* ================= global events ================= */
document.addEventListener("pointerdown", e=>{ if(!e.target.closest("#startmenu") && !e.target.closest("#startbtn")) hideStart(); });
$("#startbtn").addEventListener("click", e=>{ e.stopPropagation(); toggleStart(); });
$("#desktop").addEventListener("contextmenu", e=>{ if(!e.target.closest(".dicon")){ e.preventDefault(); showDesktopMenu(e);} });
document.addEventListener("pointerdown", e=>{ if(!e.target.closest("#ctxmenu")) hideMenu(); });
document.addEventListener("keydown", e=>{
  const sel = $(".dicon.sel");
  if (e.key==="Enter" && sel){
    const id = sel.dataset.id;
    const it = DESKTOP.find(x=>x.id===id);
    if (it) it.act();
  }
});

/* ================= init ================= */
buildIcons();
buildStartMenu();
boot();
</script>
</body>
</html>
