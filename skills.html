<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skills.exe — Noah Zhou</title>
<meta name="description" content="Noah Zhou's skills & projects — a Windows XP desktop tribute. Double-click an icon to explore.">
<link rel="icon" href="assets/xp/favicon.png">
<style>
:root{
  --cap1:#0058e6; --cap2:#3a9bff; --capIn1:#7fa9e8; --capIn2:#c3d6f7;
  --luna-face:#ece9d8; --border:#0831d9; --btnface:#f0eee2;
  --f:"Tahoma","Segoe UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
html,body{height:100%; margin:0; overflow:hidden;}
body{font-family:var(--f); font-size:11px; color:#000; background:#3a6ea5;}
body.wall-photo{background:#000 url(assets/wallpaper.jpg) center/cover no-repeat;}
body.wall-sky{background:linear-gradient(180deg,#4a7fd4 0%,#7fb0e8 55%,#cfe4f4 100%);}
body.wall-teal{background:#008080;}
.wcontent{user-select:text; -webkit-user-select:text;}

/* ═══════════ boot ═══════════ */
#boot{position:fixed; inset:0; z-index:9900; background:#000; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:30px; opacity:1; transition:opacity .45s;}
#boot.off{opacity:0; pointer-events:none;}
.boot-logo{font-size:60px; font-weight:bold; font-style:italic; letter-spacing:-1px;
  background:linear-gradient(180deg,#fff 15%,#cfd9f0 55%,#7a9fd8 90%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.boot-bar{width:218px; height:16px; border:1px solid #4a4a4a; background:#111; padding:2px; border-radius:1px;}
.boot-bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#1e56d8,#5ea0ff 55%,#2f7cf0);
  animation:bootfill 2s cubic-bezier(.25,.7,.4,1) forwards;}
@keyframes bootfill{0%{width:2%} 55%{width:64%} 85%{width:86%} 100%{width:100%}}

/* ═══════════ login / welcome ═══════════ */
#login{position:fixed; inset:0; z-index:9800; display:none; align-items:center; justify-content:center;
  background:radial-gradient(120% 105% at 50% 26%, #9fc6f4 0%, #6a97e2 34%, #3a68c4 70%, #1d3f8e 100%);}
#login::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.18), transparent 70%);}
#login .brand{position:absolute; right:18px; bottom:12px; display:flex; align-items:center; gap:6px;
  color:#dfe9f8; font-style:italic; font-weight:bold; font-size:13px; opacity:.9;}
#login .brand img{width:20px; height:auto; opacity:.85;}
#login .turnoff{position:absolute; left:16px; bottom:16px; display:flex; align-items:center; gap:7px;
  height:30px; padding:0 16px 0 10px; font-size:12px; font-weight:bold; color:#fff;
  border:1px solid #174e9e; border-radius:3px; cursor:pointer; font-family:var(--f);
  background:linear-gradient(180deg,#79b2f7 0%,#3f84e8 45%,#2a66cd 100%); box-shadow:0 2px 5px rgba(0,0,0,.3);}
#login .turnoff:hover{filter:brightness(1.1);}
#login .turnoff:active{filter:brightness(.85);}
.login-card{display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;
  padding:26px 44px 24px; border-radius:10px;}
.login-card .pic{width:120px; height:120px; border-radius:10px; box-shadow:0 8px 22px rgba(0,0,0,.4);
  background:#fff; display:grid; place-items:center; border:2px solid #e8f1fd; outline:1px solid #7fa3d8;}
.login-card .pic img{width:100%; height:100%; border-radius:12px;}
.login-card .nm{color:#fff; font-size:26px; font-weight:bold; text-shadow:0 2px 6px rgba(0,0,0,.45); margin-top:4px;}
.login-card .role{color:#d7e5f8; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.4);}
.login-card:hover .pic{outline:3px solid rgba(255,255,255,.65); outline-offset:3px;}
.login-hint{position:absolute; left:0; right:0; top:16%; text-align:center; color:#e3edfb; font-size:14px;
  text-shadow:0 1px 3px rgba(0,0,0,.45); letter-spacing:.2px;}
#welcome{position:fixed; inset:0; z-index:9850; background:#000; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:26px;}
#welcome .wl{font-size:44px; font-weight:bold; font-style:italic; letter-spacing:0;
  background:linear-gradient(180deg,#fff 20%,#b9cdf2 70%,#6f97dc 95%); -webkit-background-clip:text; background-clip:text; color:transparent;}

/* ═══════════ shutdown ═══════════ */
#shutdown{position:fixed; inset:0; z-index:9950; background:#000; display:none; align-items:center; justify-content:center;}
#shutdown .txt{color:#f60; font-size:26px; font-family:"Lucida Console",Consolas,monospace; text-align:center;}

/* ═══════════ desktop ═══════════ */
#desktop{position:absolute; inset:0 0 30px 0;}
#icons{position:absolute; top:3px; left:2px; display:flex; flex-direction:column; flex-wrap:wrap;
  align-content:flex-start; height:calc(100% - 6px); gap:3px; z-index:5;}
.dicon{width:76px; padding:7px 2px 5px; display:flex; flex-direction:column; align-items:center; gap:4px;
  border:1px solid transparent; border-radius:2px; cursor:default;}
.dicon .ico{width:32px; height:32px; display:block; object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.dicon .lab{color:#fff; text-align:center; line-height:1.25; max-width:74px; font-size:11px;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.6);}
.dicon:hover{border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07);}
.dicon.sel{border:1px solid rgba(0,80,220,.5); background:rgba(60,120,255,.22);}
.dicon.sel .lab{background:#0a4fd6; text-shadow:none; border-radius:2px; padding:0 2px;}

/* ═══════════ windows ═══════════ */
#winlayer{position:absolute; inset:0; z-index:10; pointer-events:none;}
.win{position:absolute; min-width:200px; min-height:110px; pointer-events:auto; display:flex; flex-direction:column;
  background:var(--luna-face); border-radius:8px 8px 0 0;
  border:1px solid #0d4fc7; box-shadow:3px 4px 14px rgba(0,0,0,.5);}
.win.maximized{border-radius:0;}
.win .wtitle{height:28px; display:flex; align-items:center; gap:6px; padding:0 2px 0 8px; flex:0 0 auto;
  background:linear-gradient(180deg,#0058e6 0%,#1467ea 6%,#1f79f0 40%,#2f90f8 88%,#1c6fe8 100%);
  border-radius:7px 7px 0 0;}
.win.maximized .wtitle{border-radius:0;}
.win.inactive .wtitle{background:linear-gradient(180deg,#7d93bd 0%,#8296bd 40%,#a3b5d4 88%,#8da1c4 100%);}
.win .wtitle img.tic{width:16px; height:16px; object-fit:contain;}
.win .wtitle .tt{flex:1; min-width:0; color:#fff; font-weight:bold; font-size:11px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; text-shadow:1px 1px 2px rgba(0,0,20,.55);}
.win.inactive .wtitle .tt{text-shadow:none;}
.xbtns{display:flex; gap:2px; align-items:center; padding-right:1px;}
.capbtn{position:relative; width:21px; height:21px; border-radius:3px; border:1px solid rgba(255,255,255,.75);
  cursor:pointer; padding:0; display:block;}
.capbtn svg{position:absolute; inset:0; margin:auto; display:block;}
.capbtn.mn{background:linear-gradient(180deg,#4a9cf8 0%,#2377ea 45%,#1a66d8 100%);}
.capbtn.mx{background:linear-gradient(180deg,#4a9cf8 0%,#2377ea 45%,#1a66d8 100%);}
.capbtn.cl{background:linear-gradient(180deg,#f4a09a 0%,#e1584c 45%,#c93a2c 100%);}
.capbtn.mn:hover{filter:brightness(1.15);} .capbtn.mx:hover{filter:brightness(1.15);}
.capbtn.cl:hover{filter:brightness(1.12);}
.capbtn:active{filter:brightness(.85);}
.win.inactive .capbtn{border-color:rgba(255,255,255,.55); background:linear-gradient(180deg,#c7cede,#aeb6c9 50%,#99a3ba);}
.win.inactive .capbtn.cl{background:linear-gradient(180deg,#d9a19c,#c0746c 50%,#ab5a52);}
.win .wbody{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--luna-face);}
.win .wcontent{flex:1; min-height:0; overflow:auto; background:#fff;}
.win .wstatus{flex:0 0 auto; display:flex; gap:6px; padding:2px 5px; background:var(--luna-face);
  border-top:1px solid #d9d4c4; font-size:11px;}
.status-sunken{background:#fff; border:1px solid #aca899; border-top-color:#6e6a5e; border-left-color:#6e6a5e;
  padding:1px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* menubar */
.menubar{flex:0 0 auto; display:flex; align-items:center; height:20px; background:var(--luna-face); padding:0 2px;}
.mbar-item{padding:2px 7px; font-size:11px; cursor:default; border-radius:2px;}
.mbar-item:hover,.mbar-item.open{background:#0a4fd6; color:#fff;}

/* dropdown menu */
.mddrop{position:fixed; z-index:9000; background:#fff; border:1px solid #8a94ac; box-shadow:3px 3px 8px rgba(0,0,0,.4);
  padding:2px; min-width:150px; display:none;}
.mddrop .mi{display:flex; align-items:center; gap:7px; padding:4px 26px 4px 6px; cursor:default; white-space:nowrap;}
.mddrop .mi img{width:16px; height:16px; object-fit:contain;}
.mddrop .mi:hover{background:#0a4fd6; color:#fff;}
.mddrop .mi.dis{color:#9a9a9a;} .mddrop .mi.dis:hover{background:transparent; color:#9a9a9a;}
.mddrop .msep{border-top:1px solid #d6d2c4; margin:3px 2px;}
.mddrop .mi .acc{margin-left:auto; padding-left:20px; color:#888;}
.mddrop .mi:hover .acc{color:#fff;}

/* toolbar */
.toolbar{flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:3px 6px;
  background:linear-gradient(180deg,#f9f7f0,#e9e5d6); border-bottom:1px solid #d3cdbb;}
.tbtn{display:flex; align-items:center; gap:4px; height:24px; padding:0 7px; cursor:default;
  background:linear-gradient(180deg,#fdfdfb,#e3dfd0); border:1px solid #b9b4a3; border-radius:3px; font-size:11px;}
.tbtn img{width:16px; height:16px; object-fit:contain;}
.tbtn.dis{color:#9c9c9c; border-color:#d5d0c2; background:#f0ede2;}
.tbtn:not(.dis):hover{background:linear-gradient(180deg,#f2f8ff,#d7e8fc); border-color:#8cb4e8;}
.tbtn:not(.dis):active{background:#d9e8fb;}
.tsep{width:1px; height:20px; background:#c6c2b4; margin:0 4px;}
.taddr{flex:1; display:flex; align-items:center; gap:4px; height:22px; padding:0 4px;
  background:#fff; border:1px solid #7b8aa5; box-shadow:inset 0 1px 2px rgba(0,0,0,.12); font-size:11px; min-width:0;}
.taddr img{width:14px; height:14px; object-fit:contain; flex:0 0 auto;}
.taddr .tv{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.taddr .arrow{width:16px; height:16px; flex:0 0 auto; background:url(assets/xp/dropdown.png) center/11px no-repeat;}

/* explorer panes */
.xp-split{display:flex; flex:1; min-height:0;}
.xp-tree{width:210px; min-width:150px; background:#fff; overflow:auto; padding:5px 2px; border-right:1px solid #e0ddcf;}
.xp-detail{flex:1; min-width:0; background:#fff; overflow:auto; padding:10px 14px;}
.tree-node .trow{display:flex; align-items:center; gap:3px; padding:2px 3px; cursor:default; border-radius:2px; white-space:nowrap;}
.tree-node .trow:hover{background:#e8f0fe;}
.tree-node .trow img{width:16px; height:16px; object-fit:contain;}
.tree-node .trow .tw{width:14px; text-align:center; color:#555; font-size:8px;}
.tree-node .trow b{font-weight:normal;}
.tree-node ul{list-style:none; margin:0; padding:0 0 0 17px;}
.tree-node.collapsed ul{display:none;}
.skill-row{display:flex; align-items:center; gap:5px; padding:2px 3px; border-radius:2px; cursor:default; white-space:nowrap;}
.skill-row:hover{background:#e8f0fe;}
.skill-row.sel{background:#0a4fd6; color:#fff;}
.skill-row img{width:16px; height:16px; object-fit:contain;}
.skill-row .snm{overflow:hidden; text-overflow:ellipsis;}
.detail-title{display:flex; align-items:center; gap:9px; margin:0 0 3px; font-size:16px;}
.detail-title img{width:28px; height:28px; object-fit:contain;}
.detail-sub{color:#666; margin:0 0 10px;}
.proj{display:flex; gap:9px; align-items:baseline; padding:6px 7px; border:1px solid #e6e1d3; border-radius:3px; margin-bottom:5px; background:#fdfcf8;}
.proj:hover{border-color:#9ac2ee; background:#eef4fd;}
.proj img{width:16px; height:16px; object-fit:contain; align-self:center; flex:0 0 auto;}
.proj a{color:#0046c8; text-decoration:none; font-weight:bold;}
.proj a:hover{text-decoration:underline;}
.proj .pd{color:#444;}
.empty-state{color:#777; text-align:center; padding:42px 10px; font-size:12px;}
.empty-state img{display:block; margin:0 auto 10px; width:44px; height:44px;}

/* list windows (projects) */
.app-list{list-style:none; margin:0; padding:4px 6px;}
.app-list li{display:flex; gap:10px; padding:7px 8px; border-bottom:1px solid #eee;}
.app-list li:hover{background:#eef4fd;}
.app-list img{width:16px; height:16px; object-fit:contain; margin-top:2px; flex:0 0 auto;}
.app-list a{color:#0046c8; text-decoration:none; font-weight:bold; font-size:12px;}
.app-list a:hover{text-decoration:underline;}
.app-list .pd{color:#555; font-size:11px; margin-top:1px;}
.app-list .tags{font-size:10px; color:#888;}

/* tasks pane (recycle bin etc) */
.tasks-pane{width:168px; min-width:140px; background:linear-gradient(180deg,#f6f7fb,#e7eaf4); border-right:1px solid #d5d8e4;
  padding:10px 8px; font-size:11px;}
.tasks-pane .tp-cap{font-size:11px; color:#3b5a9c; font-weight:bold; margin:2px 2px 6px;}
.tasks-pane .tp-item{display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:2px; cursor:default;}
.tasks-pane .tp-item img{width:16px; height:16px;}
.tasks-pane .tp-item:hover{background:#cce0fb; text-decoration:underline;}
.tasks-pane .tp-item.dis{color:#999; cursor:default;} .tasks-pane .tp-item.dis:hover{background:transparent; text-decoration:none;}

/* about / content */
.about{padding:16px 20px; max-width:620px;}
.about h2{margin:0 0 2px; font-size:17px;}
.about .sub{color:#666; margin-bottom:10px;}
.about p{line-height:1.6; margin:0 0 10px;}
.about h4{margin:13px 0 5px; font-size:12px; color:#333;}
.about .row{display:flex; flex-wrap:wrap; gap:6px; margin:3px 0 6px;}
.chip{border:1px solid #9cc0ea; background:#e8f1fc; color:#1a4b8f; border-radius:10px; padding:2px 9px; font-size:11px;}
.about .links div{display:flex; align-items:center; gap:7px; margin-bottom:6px;}
.about .links img{width:16px; height:16px;}
.about .links a{color:#0046c8; text-decoration:none;}
.about .links a:hover{text-decoration:underline;}
.about .credit{margin-top:16px; color:#999; font-size:10px; border-top:1px dotted #ccc; padding-top:8px;}

/* IE home */
.ie-home{padding:18px 26px; background:#fff;}
.ie-home h1{font-size:20px; margin:2px 0 4px; color:#000;}
.ie-home .iesub{color:#666; font-size:11px; margin-bottom:18px; border-bottom:1px solid #eee; padding-bottom:10px;}
.ie-grid{display:flex; flex-wrap:wrap; gap:14px;}
.ie-card{width:150px; border:1px solid #d9d9d9; border-radius:4px; padding:10px; text-align:center; cursor:pointer;}
.ie-card img{width:32px; height:32px; object-fit:contain; margin-bottom:6px;}
.ie-card .n{font-size:11px; font-weight:bold; color:#0046c8; text-decoration:underline;}
.ie-card:hover{background:#eef4fd; border-color:#9ac2ee;}
.ie-card .d{font-size:10px; color:#777; margin-top:3px;}

/* taskbar */
#taskbar{position:fixed; left:0; right:0; bottom:0; height:30px; z-index:6000;
  background:linear-gradient(180deg,#1f4fc0 0%,#2e6ce0 4%,#3d8bf5 10%,#3583f0 22%,#245edb 55%,#163ea8 88%,#102f8d 100%);
  display:flex; align-items:center; padding:0 3px; gap:2px;}
#startbtn{display:flex; align-items:center; gap:5px; height:26px; padding:0 8px 0 5px; border:none; cursor:pointer;
  color:#fff; font-family:"Trebuchet MS","Tahoma",sans-serif; font-weight:bold; font-style:italic; font-size:17px;
  text-shadow:0 1px 1px rgba(0,0,0,.4); border-radius:0 10px 10px 0; border-left:2px solid rgba(255,255,255,.55);
  background:linear-gradient(180deg,#56c64e 0%,#3aa534 20%,#2c8c27 55%,#1e6f1c 100%);}
#startbtn:active{filter:brightness(.85);}
#startbtn.on{filter:brightness(.8);}
#ql{display:flex; align-items:center; gap:4px; margin-left:5px; padding:0 6px 0 2px; border-right:1px solid rgba(0,0,0,.4);}
#ql button{width:22px; height:22px; border:none; background:transparent; cursor:pointer; padding:2px; border-radius:2px;}
#ql button img{width:100%; height:100%; object-fit:contain;}
#ql button:hover{background:rgba(255,255,255,.28);}
#tasks{flex:1; display:flex; gap:2px; align-items:center; overflow:hidden;}
.task{height:24px; min-width:60px; max-width:170px; display:flex; align-items:center; gap:5px; padding:0 8px; cursor:pointer;
  color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:3px; font-family:var(--f); font-size:11px;
  background:linear-gradient(180deg,#4a9bf8,#2f78ec 55%,#1e5ad4); box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
.task img{width:16px; height:16px; object-fit:contain; flex:0 0 auto;}
.task .tl{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.task.act{background:linear-gradient(180deg,#7ec1ff,#4a94f5 55%,#3273e0); border-color:#fff;}
.task:hover{filter:brightness(1.08);}
#tray{display:flex; align-items:center; gap:7px; padding:0 8px 0 7px; height:100%; color:#fff;
  border-left:1px solid rgba(0,0,0,.35); box-shadow:inset 1px 0 0 rgba(255,255,255,.15);
  background:linear-gradient(180deg,#0fa3ef 0%,#0fa3ef 45%,#0d8adf 100%); font-size:11px;}
#tray .spk{width:15px; height:15px;}
#clock{text-align:center; line-height:1.25; cursor:default;}

/* start menu */
#startmenu{position:fixed; left:2px; bottom:32px; z-index:7000; width:300px; display:none;
  background:var(--luna-face); border:1px solid #0a46a8; border-radius:8px 8px 8px 0;
  box-shadow:4px 5px 14px rgba(0,0,0,.45); overflow:hidden; flex-direction:column;}
#startmenu .sm-head{display:flex; align-items:center; gap:8px; padding:7px 10px;
  background:linear-gradient(180deg,#3f9df5,#2c80e8 60%,#1c66d0);}
#startmenu .sm-head img{width:42px; height:42px; border-radius:6px;}
#startmenu .sm-head .u{color:#fff; font-size:16px; font-weight:bold; text-shadow:0 1px 2px rgba(0,0,30,.5);}
#startmenu .sm-head .c{color:#d6e6fb; font-size:10px; margin-top:2px;}
#startmenu .sm-body{display:flex; flex:1; min-height:0;}
#startmenu .sm-left{width:50%; padding:5px 3px 3px; display:flex; flex-direction:column; min-height:0;}
#startmenu .sm-right{width:50%; background:linear-gradient(90deg,#d8e6fa 0%,#eaf3fe 30%,#f4f9ff 100%);
  border-left:1px solid #bcd0ea; padding:8px 4px 4px; display:flex; flex-direction:column; justify-content:space-evenly;}
.sm-cap{font-size:11px; color:#888; padding:2px 8px 1px; text-align:left;}
.sm-item{display:flex; align-items:center; gap:8px; padding:4px 8px; cursor:default; border-radius:3px; font-size:11px; color:#000;}
.sm-item img{width:24px; height:24px; object-fit:contain; flex:0 0 auto;}
.sm-item:hover{background:#0a4fd6; color:#fff;}
.sm-right .sm-item{color:#0f3e8f; font-weight:bold; padding:4px 7px;}
.sm-right .sm-item img{width:24px; height:24px;}
.sm-right .sm-item:hover{background:#cfe0fb; color:#0a3f8f;}
.sm-sep{border-top:1px solid #d9d5c6; margin:3px 8px;}
#sm-scroll{flex:1; overflow:hidden; position:relative;}
.sm-all{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;
  margin:auto 4px 4px; padding:4px 9px; cursor:pointer;
  font-size:11px; color:#fff; font-weight:bold; border-radius:3px;
  background:linear-gradient(180deg,#58bd51 0%,#3c9f35 45%,#2d8727 100%); border:1px solid #1c6418;}
.sm-all:hover{filter:brightness(1.08);}
.sm-btm{display:flex; align-items:flex-end; padding:0;}
.sm-btm .sm-off{flex:1; display:flex; gap:4px; justify-content:flex-end; padding:0 8px 5px 0;}
.sm-off button{display:flex; align-items:center; gap:5px; height:24px; padding:0 9px; font-size:11px; cursor:pointer;
  border-radius:3px; font-family:var(--f); border:1px solid rgba(0,0,0,.35);}
.sm-off button svg{width:14px; height:14px;}
.sm-off .logoff{color:#000; background:linear-gradient(180deg,#fdfdfb,#e9e6d8 45%,#dcd8c6); border-color:#7d8ca8;}
.sm-off .turnoff{color:#fff; background:linear-gradient(180deg,#5fc456 0%,#3ca233 45%,#2b8325 100%); border-color:#145c10;
  text-shadow:0 1px 1px rgba(0,0,0,.35);}
.sm-off .logoff svg{stroke:#3c4a5c;}
.sm-off .turnoff svg{stroke:#fff;}
.sm-off button:hover{filter:brightness(1.1);} .sm-off button:active{filter:brightness(.85);}
#sm-allprogs{position:fixed; z-index:7100; width:196px; display:none; background:#fff;
  border:1px solid #7c94b8; border-radius:3px; box-shadow:4px 5px 12px rgba(0,0,0,.45); padding:2px;
  overflow-y:auto; max-height:420px;}
#sm-allprogs .mi{display:flex; align-items:center; gap:7px; padding:4px 20px 4px 6px; cursor:default; font-size:11px;}
#sm-allprogs .mi img{width:16px; height:16px; object-fit:contain;}
#sm-allprogs .mi:hover{background:#0a4fd6; color:#fff;}
#sm-allprogs .msep{border-top:1px solid #d6d2c4; margin:3px 2px;}
#sm-allprogs .cap{font-size:10px; color:#888; padding:3px 6px 1px;}

/* context menu */
#ctxmenu{position:fixed; z-index:7500; background:#fff; border:1px solid #8a94ac; box-shadow:3px 3px 8px rgba(0,0,0,.4);
  padding:2px; min-width:160px; display:none;}
#ctxmenu .mi{display:flex; align-items:center; gap:8px; padding:4px 30px 4px 6px; cursor:default; white-space:nowrap; font-size:11px;}
#ctxmenu .mi img{width:16px; height:16px;}
#ctxmenu .mi:hover{background:#0a4fd6; color:#fff;}
#ctxmenu .mi .subarr{margin-left:auto; font-size:8px; color:#777;}
#ctxmenu .mi:hover .subarr{color:#fff;}
#ctxmenu .msep{border-top:1px solid #d6d2c4; margin:3px 2px;}
#ctxmenu .mi.dis{color:#aaa;} #ctxmenu .mi.dis:hover{background:transparent; color:#aaa;}
#ctxsub{position:fixed; z-index:7600; background:#fff; border:1px solid #8a94ac; box-shadow:3px 3px 8px rgba(0,0,0,.4);
  padding:2px; min-width:120px; display:none;}
#ctxsub .mi{display:flex; align-items:center; gap:8px; padding:4px 24px 4px 6px; cursor:default; white-space:nowrap; font-size:11px;}
#ctxsub .mi:hover{background:#0a4fd6; color:#fff;}
#ctxsub .mi.checked::before{content:""; width:10px; height:10px; background:url(assets/xp/checked.png) no-repeat center/contain;}

/* dialogs */
.dlg-buttons{display:flex; justify-content:flex-end; gap:6px; padding:12px 12px 12px; background:var(--luna-face);}
.xpbtn{min-width:74px; height:23px; padding:0 14px; font-family:var(--f); font-size:11px; cursor:pointer;
  border:1px solid #7d8ca8; border-radius:3px; background:linear-gradient(180deg,#fdfdfb,#e9e6d8 45%,#dcd8c6);}
.xpbtn:active{background:linear-gradient(180deg,#d4d0be,#c4c0ac);}
.xpbtn:focus{outline:1px dotted #333; outline-offset:-3px;}
.xpbtn.default{border-color:#1f5fcd; background:linear-gradient(180deg,#eaf3fd,#cfe2fa 45%,#b9d4f5);}
.tabs{display:flex; padding:10px 10px 0; background:var(--luna-face); align-items:flex-end; gap:2px;}
.tab{padding:4px 12px 3px; font-size:11px; cursor:default; background:var(--luna-face);
  border:1px solid #aca899; border-bottom:none; border-radius:4px 4px 0 0;}
.tab.act{background:#fff; padding-bottom:4px; position:relative; top:1px; border-bottom:1px solid #fff; font-weight:bold;}
.tabpane{flex:1; min-height:0; background:#fff; border-top:1px solid #aca899; padding:14px 14px; overflow:auto; margin:0 10px 10px;}
.dlg{display:flex; flex-direction:column;}
.mon-prev{width:200px; height:150px; border:2px solid #666; border-radius:6px 6px 3px 3px; padding:5px; background:#eef0f2; position:relative;}
.mon-prev .screen{width:100%; height:100%; border:1px solid #333; background:#3a6ea5; overflow:hidden; position:relative;}
.wall-list label{display:flex; align-items:center; gap:8px; padding:3px 6px; cursor:pointer; border-radius:2px;}
.wall-list label:hover{background:#e8f0fe;}
.wall-list input{margin:0;}
.wall-thumb{width:52px; height:38px; border:1px solid #999; flex:0 0 auto;}

/* notepad */
.np-text{width:100%; height:100%; border:none; resize:none; font-family:"Lucida Console",Consolas,monospace; font-size:12px;
  padding:6px 8px; background:#fff; color:#000; outline:none;}

const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

/* ================= window manager ================= */
let zTop = 100, nextCascade = 0, focusedId = null;
const winState = {};   // id -> {el, min, max, taskBtn, mxBtn}

function focusWin(id){
  const s = winState[id]; if(!s) return;
  focusedId = id;
  s.el.style.zIndex = ++zTop;
  s.el.classList.remove("inactive");
  $$(".win").forEach(w=>{ if(w!==s.el) w.classList.add("inactive"); });
  Object.entries(winState).forEach(([k,v])=>{ v.taskBtn.classList.toggle("act", k===id && !v.min); });
}
function taskClick(id){
  const s = winState[id]; if(!s) return;
  if (s.min){ restoreWin(id); }
  else if (focusedId === id){ minimizeWin(id); }
  else focusWin(id);
}
function minimizeWin(id){
  const s = winState[id]; s.min = true; s.el.style.display="none"; s.taskBtn.classList.remove("act");
}
function restoreWin(id){
  const s = winState[id]; s.min=false; s.el.style.display="flex"; focusWin(id);
}
function closeWin(id){
  const s = winState[id]; if(!s) return;
  closeMenus();
  s.el.remove(); s.taskBtn.remove(); delete winState[id];
  const rest = Object.keys(winState);
  if(rest.length) focusWin(rest[rest.length-1]);
}
function minimizeAll(){ Object.keys(winState).forEach(minimizeWin); }
function toggleMax(id){
  const s = winState[id]; if(!s) return;
  const el = s.el;
  if (s.max){
    s.max=false; el.classList.remove("maximized");
    el.style.left=s.prev.x+"px"; el.style.top=s.prev.y+"px";
    el.style.width=s.prev.w+"px"; el.style.height=s.prev.h+"px";
    s.mxBtn.innerHTML = captionGlyph("mx");
  } else {
    s.max=true;
    const r = el.getBoundingClientRect();
    s.prev = {x:r.left, y:r.top, w:r.width, h:r.height};
    el.classList.add("maximized");
    el.style.left="0"; el.style.top="0"; el.style.width="100%"; el.style.height="calc(100% - 30px)";
    s.mxBtn.innerHTML = captionGlyph("rst");
  }
  focusWin(id);
}

function captionGlyph(kind){
  if(kind==="mn") return '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 6.5h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
  if(kind==="mx") return '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="#fff" stroke-width="1.5"/></svg>';
  if(kind==="rst") return '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.2" y="3.2" width="5.6" height="5.6" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M3.2 3.2v-2h5.6v5.6h-2" fill="none" stroke="#fff" stroke-width="1.4"/></svg>';
  return '<svg width="8" height="8" viewBox="0 0 8 8"><path d="M0 0l8 8M8 0L0 8" stroke="#fff" stroke-width="1.7"/></svg>';
}

function createWin(id, title, icon, contentHTML, opts){
  opts = opts || {};
  closeWin(id);
  const el = document.createElement("div");
  el.className = "win";
  el.style.zIndex = ++zTop;
  const tw = document.createElement("div"); tw.className="wtitle";
  const tbody = document.createElement("div"); tbody.className="wbody";
  el.appendChild(tw); el.appendChild(tbody);

  const W = opts.w || Math.min(820, innerWidth-40);
  const H = opts.h || Math.min(540, innerHeight-90);
  const cx = 46 + (nextCascade*28) % 150, cy = 22 + (nextCascade*24) % 110;
  nextCascade++;
  const availW = Math.max(300, innerWidth-60), availH = Math.max(240, innerHeight-96);
  const ww = Math.min(W, availW), wh = Math.min(H, availH);
  el.style.width = ww+"px"; el.style.height = wh+"px";
  const maxX = Math.max(0, innerWidth - ww - 8), maxY = Math.max(0, innerHeight - 30 - wh - 6);
  el.style.left = Math.min(cx, maxX)+"px"; el.style.top = Math.min(cy, maxY)+"px";

  const dialog = !!opts.dialog;
  tw.innerHTML = '<img class="tic" src="'+icon+'" alt=""><span class="tt"></span>';
  tw.querySelector(".tt").textContent = title;
  const btns = document.createElement("div"); btns.className="xbtns";
  let mxBtn = null;
  if (!dialog){
    const bMin=document.createElement("button"), bCl=document.createElement("button");
    bMin.className="capbtn mn"; bMin.title="Minimize"; bMin.innerHTML=captionGlyph("mn");
    bCl.className="capbtn cl"; bCl.title="Close"; bCl.innerHTML=captionGlyph("cl");
    mxBtn=document.createElement("button"); mxBtn.className="capbtn mx"; mxBtn.title="Maximize"; mxBtn.innerHTML=captionGlyph("mx");
    btns.append(bMin,mxBtn,bCl);
    bMin.addEventListener("click", e=>{e.stopPropagation(); minimizeWin(id);});
    mxBtn.addEventListener("click", e=>{e.stopPropagation(); toggleMax(id);});
    bCl.addEventListener("click", e=>{e.stopPropagation(); closeWin(id);});
  } else {
    const bCl=document.createElement("button");
    bCl.className="capbtn cl"; bCl.title="Close"; bCl.innerHTML=captionGlyph("cl");
    btns.appendChild(bCl);
    bCl.addEventListener("click", e=>{e.stopPropagation(); closeWin(id);});
  }
  tw.appendChild(btns);

  const tic = el.querySelector(".tic");
  tic.style.width = dialog ? "18px" : "16px";
  tic.style.height = dialog ? "18px" : "16px";
  if (opts.titleIcon && opts.titleIcon.w){ tic.style.width=opts.titleIcon.w+"px"; tic.style.height=opts.titleIcon.h+"px"; }

  if (typeof contentHTML === "function") contentHTML = contentHTML(el);
  tbody.innerHTML = contentHTML;

  el.addEventListener("pointerdown", ()=>focusWin(id), true);

  /* drag */
  let drag=null;
  tw.addEventListener("pointerdown", e=>{
    if (e.target.closest(".capbtn") || e.target.closest(".mbar-item")) return;
    if (winState[id] && winState[id].max) return;
    focusWin(id);
    drag = {sx:e.clientX, sy:e.clientY, ox:el.offsetLeft, oy:el.offsetTop};
    tw.setPointerCapture(e.pointerId);
  });
  tw.addEventListener("pointermove", e=>{
    if(!drag) return;
    const nx = Math.min(Math.max(0, drag.ox + e.clientX - drag.sx), Math.max(0, innerWidth - el.offsetWidth - 2));
    const ny = Math.min(Math.max(0, drag.oy + e.clientY - drag.sy), Math.max(0, innerHeight - 30 - el.offsetHeight - 2));
    el.style.left=nx+"px"; el.style.top=ny+"px";
  });
  const endDrag=()=>{ drag=null; };
  tw.addEventListener("pointerup", endDrag);
  tw.addEventListener("pointercancel", endDrag);
  tw.addEventListener("dblclick", e=>{ if(!e.target.closest(".capbtn") && !dialog) toggleMax(id); });

  /* taskbar button */
  const tb = document.createElement("button");
  tb.className="task";
  tb.innerHTML = '<img src="'+icon+'" alt=""><span class="tl"></span>';
  tb.querySelector(".tl").textContent = title;
  tb.addEventListener("click", ()=>taskClick(id));
  $("#tasks").appendChild(tb);

  winState[id] = {el, min:false, max:false, taskBtn:tb, mxBtn};
  $("#winlayer").appendChild(el);
  focusWin(id);
  return id;
}

/* ================= dropdown menus ================= */
let openMenuEl = null;
function closeMenus(){
  $$(".mddrop").forEach(m=>{ m.style.display="none"; m.remove(); });
  $$(".mbar-item").forEach(x=>x.classList.remove("open"));
  openMenuEl = null;
}
function buildMenubar(winId, defs){
  const bar = document.createElement("div"); bar.className="menubar";
  defs.forEach(def=>{
    if(def === "sep"){ return; }
    const it = document.createElement("span");
    it.className="mbar-item"; it.textContent = def.label;
    it.addEventListener("click", e=>{
      e.stopPropagation();
      const open = openMenuEl === it;
      closeMenus();
      if(open) return;
      it.classList.add("open"); openMenuEl = it;
      const menu = document.createElement("div"); menu.className="mddrop";
      def.items.forEach(item=>{
        if(item === "-"){ const sp=document.createElement("div"); sp.className="msep"; menu.appendChild(sp); return; }
        const row = document.createElement("div"); row.className="mi"+(item.disabled?" dis":"");
        if(item.icon) row.appendChild(Object.assign(document.createElement("img"),{src:item.icon,alt:""}));
        else row.style.paddingLeft = "24px";
        const lb = document.createElement("span"); lb.textContent = item.label; row.appendChild(lb);
        if(item.acc){ const a=document.createElement("span"); a.className="acc"; a.textContent=item.acc; row.appendChild(a); }
        if(!item.disabled && item.act) row.addEventListener("click", ev=>{ ev.stopPropagation(); const r=item.act(); closeMenus(); if(r===false){} });
        menu.appendChild(row);
      });
      document.body.appendChild(menu);
      const r = it.getBoundingClientRect();
      menu.style.display="block";
      menu.style.left = r.left+"px";
      menu.style.top = (r.bottom+1)+"px";
      const mr = menu.getBoundingClientRect();
      if(mr.right > innerWidth-2) menu.style.left = Math.max(2, innerWidth-mr.width-2)+"px";
    });
    bar.appendChild(it);
  });
  return bar;
}
function attachMenubar(winId, defs){
  const w = winState[winId].el;
  const mb = buildMenubar(winId, defs);
  w.querySelector(".wbody").insertBefore(mb, w.querySelector(".wbody").firstChild);
  return mb;
}

function hideCtx(){ const c=$("#ctxmenu"); c.style.display="none"; $("#ctxsub").style.display="none"; }
function showCtx(x,y,html){ const c=$("#ctxmenu"); c.innerHTML=html; c.style.display="block"; const r=c.getBoundingClientRect();
  c.style.left=Math.min(x,innerWidth-r.width-4)+"px"; c.style.top=Math.min(y,innerHeight-34-r.height-4)+"px"; }

  s.style.left=Math.min(x,innerWidth-r.width-4)+"px"; s.style.top=Math.min(y,innerHeight-34-r.height-4)+"px"; }
function sortIconsBy(mode){
  const wrap=$("#icons");

  arr.sort((a,b)=>{
    const A=DESKTOP.find(x=>x.id===a.dataset.id), B=DESKTOP.find(x=>x.id===b.dataset.id);
    if(!A||!B) return 0;
    if(mode==="name") return A.label.localeCompare(B.label);
    return 0;
  });
  arr.forEach(d=>wrap.appendChild(d));
}

function renderSkillTree(){
  const tree = $("#sk-tree"), detail = $("#sk-detail");
  if(!tree) return;
  const skillRows = [];
  let sel = null, totalSkills=0, totalProj=0;
  tree.innerHTML="";
  for (const [group, skills] of Object.entries(DATA)){
    const node = document.createElement("div"); node.className="tree-node";
    const head = document.createElement("div"); head.className="trow";
    head.innerHTML = '<span class="tw">▼</span><img src="'+XP.folder16+'" alt=""><b>'+group+'</b>';
    head.addEventListener("click", ()=>{
      node.classList.toggle("collapsed");
      head.querySelector(".tw").textContent = node.classList.contains("collapsed")?"▶":"▼";
    });
    const ul = document.createElement("ul");
    for (const name of Object.keys(skills)){
      totalSkills++;
      const e = DATA[group][name]; totalProj += e.projects.length;
      const li = document.createElement("li");
      const row = document.createElement("div"); row.className="skill-row";
      row.innerHTML = skillIconHTML(name)+'<span class="snm">'+name+"</span>";
      row.addEventListener("click", ()=>{
        if(sel) sel.classList.remove("sel");
        row.classList.add("sel"); sel=row;
        showSkillDetail(group, name);
      });
      li.appendChild(row); ul.appendChild(li);
      skillRows.push({row, group, name});
    }
    node.appendChild(head); node.appendChild(ul);
    tree.appendChild(node);
  }
  $("#sk-count").textContent = totalSkills+" skills · "+totalProj+" projects";
  for (const r of skillRows){ if(DATA[r.group][r.name].projects.length){ r.row.click(); break; } }
}
function showSkillDetail(group, name){

function refreshIe(){

/* ================= Display Properties ================= */
function openDisplay(){
  if(winState.display && !winState.display.min) return focusWin("display");
  const tabs = ["Themes","Desktop","Screen Saver","Appearance","Settings"];
  createWin("display", "Display Properties", XP.control16,
    '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'+
    '<div class="tabs">'+tabs.map((t,i)=>'<span class="tab'+(i===1?" act":"")+'" data-t="'+i+'">'+t+"</span>").join("")+'</div>'+
    '<div class="tabpane" id="dp-pane"></div>'+
    '<div class="dlg-buttons" style="padding-top:8px;padding-bottom:10px">'+
    '<button class="xpbtn" onclick="applyDisplay()">OK</button>'+
    '<button class="xpbtn" onclick="closeWin(\'display\')">Cancel</button>'+
    '<button class="xpbtn" onclick="applyDisplay()">Apply</button></div>'+
    "</div>", {w:440, h:400, dialog:true});
  const w = winState.display.el;
  $$("#dp-pane, .dlg-buttons").forEach(()=>{});
  const tabsEl = w.querySelector(".tabs");
  tabsEl.addEventListener("click", e=>{
    const t=e.target.closest(".tab"); if(!t) return;
    tabsEl.querySelectorAll(".tab").forEach(x=>x.classList.remove("act"));
    t.classList.add("act");
    renderDpPane(+t.dataset.t);
  });
  renderDpPane(1);
}
const WALLS = [
  {v:"photo", n:"Countryside (photo)", css:"url(assets/wallpaper.jpg) center/cover"},
  {v:"sky",   n:"Sky", css:"linear-gradient(180deg,#4a7fd4,#cfe4f4)"},
  {v:"teal",  n:"Teal", css:"#008080"},
  {v:"none",  n:"(None) — solid color", css:"#3a6ea5"}
];
function renderDpPane(tab){
  const pane = $("#dp-pane"); if(!pane) return;
  const cur = document.body.dataset.wall || "photo";
  if(tab===1){
    let rows = WALLS.map(w=>{
      const bg = w.v==="photo" ? "url(assets/wallpaper.jpg) center/cover" : w.css;
      return '<label><input type="radio" name="wall" value="'+w.v+'"'+(cur===w.v?" checked":"")+
        ' onclick="setWall(\''+w.v+'\')"><span class="wall-thumb" style="background:'+bg+'"></span><span>'+w.n+"</span></label>";
    }).join("");
    pane.innerHTML = '<div style="display:flex;gap:18px;align-items:flex-start">'+
      '<div class="mon-prev"><div class="screen" id="wall-prev"></div></div>'+
      '<div class="wall-list">'+rows+'</div></div>';
    syncPrev();
  } else if(tab===0){
    pane.innerHTML = '<p style="margin-top:2px">Theme</p><div style="display:flex;align-items:center;gap:8px">'+
      '<span class="wall-thumb" style="width:34px;height:34px;background:linear-gradient(135deg,#3a9bff,#0058e6 60%,#ece9d8)"></span>'+
      '<b>Windows XP (default)</b></div><p style="color:#888;font-size:10px;margin-top:14px">My current theme. No changes allowed — it\'s already perfect.</p>';
  } else if(tab===2){
    pane.innerHTML = '<p style="color:#888">Screen saver</p><div style="border:1px solid #999;height:150px;display:grid;place-items:center;color:#bbb;font-size:11px;background:#f4f6f8">(None)</div>'+
      '<p style="font-size:11px;margin-top:8px">Screen saver: <b>(None)</b> — you are the screen saver.</p>';
  } else if(tab===3){
    pane.innerHTML = '<p>Window and buttons: <b>Windows XP style</b><br>Color scheme: <b>Default (blue)</b><br>Font size: <b>Normal</b></p>'+
      '<div style="display:flex;align-items:center;gap:10px"><span class="wall-thumb" style="width:90px;height:56px"></span><span style="font-size:10px;color:#666">Preview of the Luna (blue) color scheme.</span></div>';
  } else {
    pane.innerHTML = '<p>Display: <b>1024 × 768 pixels</b><br>Color quality: <b>Highest (32 bit)</b><br>Screen refresh rate: <b>60 Hertz</b></p>'+
      '<p style="color:#888;font-size:10px">Virtual machine — a browser tab pretending to be a computer.</p>';
  }
}
function syncPrev(){
  const cur = document.body.dataset.wall || "photo";
  const w = WALLS.find(x=>x.v===cur) || WALLS[0];
  const pv = $("#wall-prev"); if(pv) pv.style.background = w.css;
}
function setWall(v){ document.body.dataset.wall = v; syncPrev(); }
function applyDisplay(){
  const v = document.body.dataset.wall || "photo";
  document.body.className = "wall-"+v;
  try{ localStorage.setItem("xp-wall", v); }catch(e){}
  closeWin("display");
}
function refreshDesktopWall(){ /* noop */ }

/* ================= start menu ================= */
const APPS = [
  {cap:"Accessories", items:[{n:"My Skills", i:XP.folder, a:openSkills},
    {n:"My Projects", i:XP.open, a:openProjects},
    {n:"About Me", i:XP.computer, a:openAbout},
    {n:"Notepad", i:XP.note32, a:openNotepad}]},
  {cap:"Internet", items:[{n:"Internet Explorer", i:XP.ie, a:openInternet},
    {n:"GitHub", i:XP.github, a:()=>openTab("https://github.com/NoahIsARider")},
    {n:"Google Scholar", i:XP.iepaper, a:()=>openTab(SCHOLAR)},
    {n:"Homepage", i:XP.home, a:()=>openTab(HOMEPAGE)},
    {n:"Blogs", i:XP.earth, a:()=>openTab(BLOGS)}]},
  {cap:"System", items:[{n:"Display Properties", i:XP.control16, a:openDisplay}]}
];
function smIcon(p){ return '<img src="'+p+'" alt="">'; }
function buildStartMenu(){
  const m = $("#startmenu");
  const rightItems = [
    {n:"My Skills", i:XP.folder, a:openSkills},
    {n:"My Projects", i:XP.open, a:openProjects},
    {n:"About Me", i:XP.computer, a:openAbout},
    {n:"Recycle Bin", i:XP.recycle, a:openRecycle}
  ];
  const leftItems = [
    {n:"Internet Explorer", i:XP.ie, a:openInternet},
    {n:"GitHub", i:XP.github, a:()=>openTab("https://github.com/NoahIsARider")},
    {n:"Google Scholar", i:XP.iepaper, a:()=>openTab(SCHOLAR)},
    {n:"Homepage", i:XP.home, a:()=>openTab(HOMEPAGE)},
    {n:"Blogs", i:XP.earth, a:()=>openTab(BLOGS)}
  ];
  m.innerHTML =
    '<div class="sm-head"><img src="'+XP.avatar48+'" alt=""><div><div class="u">Noah Zhou</div><div class="c">skills &middot; projects &middot; about</div></div></div>'+
    '<div class="sm-body">'+
      '<div class="sm-left" id="sm-left">'+
        '<div class="sm-cap">Internet</div>'+
        leftItems.map(it=>'<div class="sm-item" data-a="'+it.n.replace(/\s/g,"")+'">'+smIcon(it.i)+"<span>"+it.n+"</span></div>").join("")+
        '<div class="sm-sep"></div>'+
        '<div class="sm-item" data-a="Notepad">'+smIcon(XP.note32)+"<span>Notepad</span></div>"+
        '<div class="sm-item" data-a="DisplayProperties">'+smIcon(XP.control16)+"<span>Display Properties</span></div>"+
      '</div>'+
      '<div class="sm-right">'+
        rightItems.map(it=>'<div class="sm-item" data-a="'+it.n.replace(/\s/g,"")+'">'+smIcon(it.i)+"<span>"+it.n+"</span></div>").join("")+
      '</div>'+
    '</div>'+
    '<div class="sm-btm">'+
    '<div class="sm-all" id="sm-allbtn"><span>All Programs</span><span style="font-size:9px">▶</span></div>'+
    '<div class="sm-off">'+
      '<button class="logoff" onclick="logOff()"><svg viewBox="0 0 16 16"><path d="M2 8h9" fill="none" stroke-width="1.8" stroke-linecap="round"/><path d="M8 4l4 4-4 4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1.5" y="3.5" width="9" height="9" rx="1.5" fill="none" stroke-width="1.5"/></svg>Log Off</button>'+
      '<button class="turnoff" onclick="turnOff()"><svg viewBox="0 0 16 16"><path d="M8 1.5v7" stroke-width="2" stroke-linecap="round"/><path d="M3.2 4a6 6 0 1 0 9.6 0" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>Turn Off Computer</button>'+
    '</div></div>';
  /* left click dispatch */
  m.addEventListener("click", e=>{
    const it = e.target.closest(".sm-item");
    if(!it){ return; }
    const key = it.dataset.a;
    hideStart();
    const all = APPS.flatMap(g=>g.items).concat(rightItems).concat(leftItems);
    const hit = all.find(x=>x.n.replace(/\s/g,"")===key);
    if(hit) hit.a();
  });
  m.querySelector("#sm-allbtn").addEventListener("click", e=>{ e.stopPropagation(); toggleAllProgs(); });
}
const ALLPROGS_MI = ()=>APPS.map(g=>
  '<div class="cap">'+g.cap+"</div>"+
  g.items.map(it=>'<div class="mi" data-a="'+it.n.replace(/\s/g,"")+'">'+img16(it.i)+"<span>"+it.n+"</span></div>").join("")+
  '<div class="msep"></div>').join("");
function toggleStart(){
  const m = $("#startmenu");
  const show = m.style.display==="none";
  hideAllProgs();
  m.style.display = show?"flex":"none";
  $("#startbtn").classList.toggle("on", show);
  if(show){ m.querySelectorAll(".sm-item").forEach(x=>x.scrollIntoView&&0); }
}
function hideStart(){ $("#startmenu").style.display="none"; $("#startbtn").classList.remove("on"); hideAllProgs(); }
function toggleAllProgs(){
  const ap = $("#sm-allprogs");
  const m = $("#startmenu");
  if(ap.style.display==="block"){ ap.style.display="none"; return; }
  ap.innerHTML = ALLPROGS_MI();
  ap.style.display="block";
  const mr = m.getBoundingClientRect();
  ap.style.left = (mr.left + mr.width - 2)+"px";
  const h = ap.scrollHeight;
  ap.style.top = Math.max(8, (mr.bottom - 8) - Math.min(h, ap.style.maxHeight?420:420)) + "px";
  const br = ap.getBoundingClientRect();
  if(br.top < 8) ap.style.top = "8px";
}
function hideAllProgs(){ $("#sm-allprogs").style.display="none"; }

/* ================= Notepad ================= */
function openNotepad(){
  if(winState.notepad && !winState.notepad.min) return focusWin("notepad");
  const txt = "skills.txt - Notepad\n=============================\n\nHello. This is a real-looking Notepad window\ninside a fake desktop. Congratulations on finding it.\n\nThings you can do here:\n  - open My Skills  (the folder on the desktop)\n  - open My Projects (everything I've built)\n  - visit About Me   (the human behind the bytes)\n  - browse the Favorites menus in any window\n  - right-click the desktop and pick Display Properties\n    to swap the wallpaper\n  - Log Off to see the welcome screen again\n\nKeyboard is not actually wired up.\nType nothing. Feel the era.\n\n        - Triton\n";
  createWin("notepad", "skills.txt - Notepad", XP.note16,
    '<div style="flex:1;min-height:0"><textarea class="np-text" spellcheck="false" readonly>'+txt.replace(/</g,"&lt;")+"</textarea></div>",
    {w:520, h:380});
  const mb = stdMenus("notepad", {view:[{label:"Refresh", disabled:true}]});
  attachMenubar("notepad", mb);
  const st = document.createElement("div"); st.className="wstatus";
  st.innerHTML = '<span class="status-sunken" style="flex:1">Ln 1, Col 1</span>';
  winState.notepad.el.querySelector(".wbody").appendChild(st);

/* ================= logon / off ================= */
let loggedIn = false;
function showLogin(){
  hideStart(); minimizeAll();
  $$(".win").forEach(w=>w.remove()); Object.keys(winState).forEach(k=>delete winState[k]);
  $("#tasks").innerHTML="";
  $("#welcome").style.display="none";
  $("#login").style.display="flex";
  loggedIn = false;
}
function doLogon(){
  if(loggedIn) return;
  $("#login").style.display="none";
  const wl = $("#welcome"); wl.style.display="flex";
  setTimeout(()=>{ wl.style.display="none"; loggedIn = true; }, 1200);
}
function logOff(){ showLogin(); }
function turnOff(){
  hideStart();
  $("#shutdown").style.display="flex";
  setTimeout(()=>{ location.reload(); }, 3200);
}

/* ================= boot / init ================= */
function applyStoredWall(){
  let v="photo";
  try{ v = localStorage.getItem("xp-wall") || "photo"; }catch(e){}
  if(!WALLS.find(w=>w.v===v)) v="photo";
  document.body.className = "wall-"+v;
  document.body.dataset.wall = v;
}
function bootSequence(){
  const b = $("#boot");
  const toLogin = ()=>{ b.classList.add("off"); setTimeout(()=>{ b.remove(); $("#login").style.display="flex"; },500); };
  b.addEventListener("click", toLogin);
  setTimeout(toLogin, 2100);
}
function tick(){
  const d = new Date();
  const h = d.getHours()%12 || 12;
  const m = String(d.getMinutes()).padStart(2,"0");
  $("#clock").textContent = h+":"+m+" "+(d.getHours()>=12?"PM":"AM");
  $("#clock").title = d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
function quickLaunch(){
  const q = $("#ql");
  const mk = (icon, title, act)=>{ const b=document.createElement("button"); b.title=title;
    b.innerHTML='<img src="'+icon+'" alt="">'; b.addEventListener("click", act); q.appendChild(b); };
  mk(XP.ie, "Internet Explorer", openInternet);
  mk(XP.github, "GitHub", ()=>openTab("https://github.com/NoahIsARider"));
}

/* ================= global events ================= */
document.addEventListener("pointerdown", e=>{
  if(!e.target.closest("#startmenu") && !e.target.closest("#startbtn")) hideStart();
  if(!e.target.closest("#ctxmenu") && !e.target.closest("#ctxsub")) hideCtx();
  if(!e.target.closest(".mddrop") && !e.target.closest(".mbar-item")) closeMenus();
  if(!e.target.closest("#sm-allprogs") && !e.target.closest(".sm-all")) hideAllProgs();
  if(!e.target.closest(".dicon")) $$(".dicon").forEach(x=>x.classList.remove("sel"));
});
$("#startbtn").addEventListener("click", e=>{ e.stopPropagation(); toggleStart(); });
$("#sm-allprogs").addEventListener("click", e=>{
  const mi = e.target.closest(".mi"); if(!mi) return;
  const key = mi.dataset.a;
  hideStart();
  const hit = APPS.flatMap(g=>g.items).find(x=>x.n.replace(/\s/g,"")===key);
  if(hit) hit.a();
});
$("#login-user").addEventListener("click", doLogon);
$("#login-off").addEventListener("click", turnOff);
$("#desktop").addEventListener("contextmenu", e=>{ if(!e.target.closest(".dicon")){ e.preventDefault(); desktopCtx(e);} });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ hideStart(); hideCtx(); closeMenus(); hideAllProgs(); }
  const sel = $(".dicon.sel");
  if (e.key==="Enter" && sel){
    const it = DESKTOP.find(x=>x.id===sel.dataset.id);
    if (it) it.act();
  }
});

/* ================= init ================= */
applyStoredWall();
quickLaunch();
buildIcons();
buildStartMenu();
tick(); setInterval(tick, 10000);
bootSequence();
</script>
