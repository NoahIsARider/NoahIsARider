<style>
  :root {
    --bg: #fafafa;
    --fg: #141414;
    --muted: #9a9a9a;
    --line: rgba(0, 0, 0, 0.09);
    --badge-bg: #ffffff;
    --badge-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --badge-hover: 0 10px 24px -8px rgba(0, 0, 0, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0c0f;
      --fg: #e9e9e9;
      --muted: #646b76;
      --line: rgba(255, 255, 255, 0.08);
      --badge-bg: #121417;
      --badge-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      --badge-hover: 0 10px 24px -8px rgba(0, 0, 0, 0.7);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background 0.35s ease, color 0.35s ease;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 9vh 28px 7vh;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Top bar ─────────────────────────────── */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    letter-spacing: 0.06em;
    animation: fade 0.8s ease both;
  }
  .top .brandline {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .top .brand {
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .top .tag {
    font-family: 'Space Grotesk', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .top .back {
    color: var(--muted);
    transition: color 0.2s ease;
  }
  .top .back:hover { color: var(--fg); }

  /* ── Sections ────────────────────────────── */
  section.group {
    padding: 52px 0 10px;
    border-top: 1px solid var(--line);
    animation: fade 0.9s ease both;
  }
  section.group:first-of-type {
    margin-top: 7vh;
    padding-top: 44px;
  }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 30px;
  }
  .group-head .idx {
    font-family: 'Space Grotesk', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .group-head h2 {
    font-weight: 400;
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  .group-head .rule {
    flex: 1;
    height: 1px;
    background: var(--line);
    transform-origin: left;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  section.group:hover .rule { transform: scaleX(1.6); }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .badges img {
    height: 34px;
    border-radius: 6px;
    background: var(--badge-bg);
    box-shadow: var(--badge-shadow);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, filter 0.25s ease;
    will-change: transform;
  }
  .badges img:hover {
    transform: translateY(-3px);
    box-shadow: var(--badge-hover);
    filter: saturate(1.1);
  }

  /* ── Footer ──────────────────────────────── */
  footer {
    margin-top: 80px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    animation: fade 0.9s 0.2s ease both;
  }
  footer a { transition: color 0.2s ease; }
  footer a:hover { color: var(--fg); }

  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
