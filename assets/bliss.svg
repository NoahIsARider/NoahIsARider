<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="green rolling hill under a blue sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5db5"/>
      <stop offset="0.45" stop-color="#5a97dd"/>
      <stop offset="0.72" stop-color="#9cc6ea"/>
      <stop offset="1" stop-color="#cfe4f4"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7db648"/>
      <stop offset="0.55" stop-color="#5d9c33"/>
      <stop offset="1" stop-color="#46802a"/>
    </linearGradient>
    <linearGradient id="hillMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ba33b"/>
      <stop offset="0.5" stop-color="#4f8c2b"/>
      <stop offset="1" stop-color="#3a6f20"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#568f30"/>
      <stop offset="0.6" stop-color="#3f7a24"/>
      <stop offset="1" stop-color="#2d5c19"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fdf3bb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fdf3bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow -->
  <circle cx="1240" cy="150" r="420" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <g opacity="0.98">
      <ellipse cx="330" cy="150" rx="150" ry="46"/>
      <ellipse cx="270" cy="130" rx="90" ry="40"/>
      <ellipse cx="405" cy="128" rx="95" ry="42"/>
      <ellipse cx="330" cy="105" rx="70" ry="34"/>
    </g>
    <g opacity="0.95">
      <ellipse cx="760" cy="210" rx="170" ry="48"/>
      <ellipse cx="690" cy="185" rx="100" ry="40"/>
      <ellipse cx="845" cy="185" rx="110" ry="42"/>
      <ellipse cx="770" cy="158" rx="80" ry="34"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1120" cy="110" rx="140" ry="40"/>
      <ellipse cx="1055" cy="92" rx="80" ry="34"/>
      <ellipse cx="1190" cy="90" rx="85" ry="36"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="140" cy="330" rx="120" ry="34"/>
      <ellipse cx="200" cy="315" rx="70" ry="28"/>
    </g>
    <g opacity="0.88">
      <ellipse cx="1450" cy="330" rx="130" ry="38"/>
      <ellipse cx="1385" cy="312" rx="80" ry="30"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="560" cy="330" rx="100" ry="28"/>
      <ellipse cx="510" cy="318" rx="60" ry="24"/>
    </g>
  </g>

  <!-- far hill -->
  <path d="M0 640 Q230 520 480 560 T950 545 T1600 560 L1600 900 L0 900 Z" fill="url(#hillFar)"/>
  <!-- main hill -->
  <path d="M0 760 Q260 570 620 640 T1250 610 Q1420 605 1600 640 L1600 900 L0 900 Z" fill="url(#hillMain)"/>
  <!-- front mound -->
  <path d="M560 900 Q900 660 1180 700 T1600 780 L1600 900 Z" fill="url(#hillFront)" opacity="0.9"/>
  <!-- blades hint: subtle light stroke on hill crest -->
  <path d="M0 760 Q260 570 620 640 T1250 610 Q1420 605 1600 640" fill="none" stroke="#b6df7e" stroke-width="6" opacity="0.55"/>
</svg>
